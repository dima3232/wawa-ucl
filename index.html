<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>⭐ Ліга чемпіонів 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1020; --bg2:#121a30; --card:#161f3a; --card2:#1b2647;
    --line:#3b4a73; --txt:#e7ecf7; --dim:#8a96b8; --gold:#f4c64a;
    --green:#3fd07d; --red:#ff6b6b; --accent:#5b8cff; --conn:#4d5d8c; --rh:42px;
  }
  *{box-sizing:border-box}
  html{margin:0}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;color:var(--txt);
    background:radial-gradient(1100px 520px at 50% -8%,#19224a 0%,transparent 60%),var(--bg);}
  a{color:var(--accent)}
  header{position:sticky;top:0;z-index:30;backdrop-filter:blur(10px);
    background:linear-gradient(180deg,rgba(11,16,32,.92),rgba(11,16,32,.7));
    border-bottom:1px solid #20294a;padding:10px 18px;display:flex;flex-direction:column;gap:9px}
  .hrow{display:flex;align-items:center;gap:14px;min-width:0}
  .hrow2{flex-wrap:wrap}
  header .logo{font-size:22px;line-height:1;flex:0 0 auto}
  header .ttl{min-width:0}
  header h1{font-size:18px;margin:0;letter-spacing:.3px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  header .sub{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* мова — у правому верхньому куті; статус притиснутий до неї праворуч,
     щоб не зʼїжджав разом із довжиною назви чемпіонату */
  .hrow1 .status{margin-left:auto;flex:0 0 auto;justify-content:flex-end}
  .hrow1 .lang{flex:0 0 auto}
  .hrow2 .auth{margin-left:auto}
  .tabs{display:flex;gap:6px;background:#0e1530;border:1px solid #20294a;border-radius:999px;padding:4px}
  .tabs button{all:unset;cursor:pointer;padding:7px 16px;border-radius:999px;font-size:13px;color:var(--dim);font-weight:600}
  .tabs button.active{background:var(--card2);color:var(--txt);box-shadow:0 1px 0 #2a3a66}
  .lang{display:flex;gap:2px;background:#0e1530;border:1px solid #20294a;border-radius:999px;padding:3px}
  .lang button{all:unset;cursor:pointer;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.3px}
  .lang button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 0 #2a3a66}
  .status{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(63,208,125,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,208,125,.5)}70%{box-shadow:0 0 0 7px rgba(63,208,125,0)}100%{box-shadow:0 0 0 0 rgba(63,208,125,0)}}

  .wrap{padding:22px}
  .view{display:none}
  .view.active{display:block}
  .crest{width:20px;height:20px;object-fit:contain;flex:0 0 auto}

  /* ===== ТАБЛИЦЯ ЛІГОВОЇ ФАЗИ (36 команд, швейцарська система) ===== */
  .tbl-wrap{max-width:820px;margin:0 auto;background:var(--card);border:1px solid #28335c;border-radius:13px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 8px;text-align:center;white-space:nowrap}
  th{color:var(--dim);font-weight:600;font-size:10px;text-transform:uppercase;background:#0f1733;border-bottom:1px solid #232f56}
  td.team{text-align:left;width:100%}
  td.team .tw{display:flex;align-items:center;gap:9px;min-width:0}
  td.team .nm{overflow:hidden;text-overflow:ellipsis;font-weight:600}
  tbody tr{border-top:1px solid #1b243f}
  tbody tr:hover{background:rgba(91,140,255,.06)}
  td .pts{font-weight:800;color:var(--txt)}
  .pos{font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}
  /* зони кваліфікації */
  tr.z1 td{background:rgba(63,208,125,.09)}
  tr.z1 .pos{color:var(--green)}
  tr.z2 td{background:rgba(244,198,74,.07)}
  tr.z2 .pos{color:var(--gold)}
  tr.z3 td{opacity:.62}
  .zone-key{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:12px auto 0;max-width:820px;font-size:11px;color:var(--dim)}
  .zone-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .empty{max-width:680px;margin:34px auto;text-align:center;color:var(--dim);font-size:13px;line-height:1.6}

  /* ===== РОЗКЛАД ===== */
  .sched{max-width:760px;margin:0 auto}
  .day-h .rl{color:var(--dim);font-weight:600;text-transform:none;letter-spacing:0}
  .day-h{position:sticky;top:var(--hh,60px);scroll-margin-top:calc(var(--hh,60px) + 10px);background:linear-gradient(180deg,var(--bg),rgba(11,16,32,.85));
    padding:10px 4px 6px;font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.5px;
    border-bottom:1px solid #232f56;margin-top:10px;text-transform:capitalize;backdrop-filter:blur(6px)}
  .day-h.focus{border-bottom:2px solid var(--gold);box-shadow:0 2px 0 rgba(244,198,74,.25)}
  .srow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid transparent;
    border-bottom-color:#1b243f;border-radius:9px;cursor:pointer}
  .srow:hover{background:rgba(91,140,255,.06)}
  .srow.today{background:linear-gradient(90deg,rgba(255,107,107,.10),transparent);border-color:#4a2740}
  .srow.live{background:linear-gradient(90deg,rgba(255,107,107,.18),transparent);border-color:var(--red)}
  .srow.live .time{color:var(--red);font-size:13px;letter-spacing:.5px}
  .srow.live .time small{color:var(--red)}
  .srow.done{opacity:.6}
  .srow .time{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px;flex:0 0 56px;width:56px;color:var(--txt);text-align:center}
  .srow .time small{display:block;font-size:9px;font-weight:600;color:var(--dim);letter-spacing:1px}
  .srow .cntcol{flex:0 0 52px;width:52px;display:flex;align-items:center;justify-content:center}
  .srow .pair{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .srow .tm{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
  .srow .tm .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow .tm .sc{flex:0 0 auto;width:22px;margin-left:8px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .srow .tm.w .sc,.srow .tm.w .nm{color:var(--gold)}
  .srow .tm.l{opacity:.55}
  .badge-live{color:#fff;background:var(--red);border-radius:4px;padding:0 5px;font-weight:700;font-size:9px;letter-spacing:.5px}
  /* оцінка «наскільки вартий перегляду»: 1–10 */
  /* фіксована ширина, а не min-width: інакше довгі підписи (SKIPPABLE / MUST-SEE)
     розсовують колонку і рахунок «стрибає» по горизонталі від рядка до рядка */
  .heat{flex:0 0 72px;width:72px;display:flex;flex-direction:column;align-items:center;gap:1px}
  .heat b{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
  .heat small{font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;opacity:.85;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .heat.h4{color:#ff7847} .heat.h3{color:var(--gold)} .heat.h2{color:#7f8db5} .heat.h1{color:#4d5675}
  .srow.hot{background:linear-gradient(90deg,rgba(255,120,71,.10),transparent);box-shadow:inset 3px 0 0 #ff7847}
  .filt{display:flex;gap:6px;justify-content:center;margin:0 0 10px}
  .filt button{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;
    color:var(--dim);background:#0e1530;border:1px solid #20294a}
  .filt button.on{color:#0b1020;background:var(--gold);border-color:var(--gold)}
  .m-heat{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 12px;font-size:13px;color:var(--dim)}
  .m-heat b{font-size:20px;font-weight:900}
  /* авторизація + бронювання */
  .auth{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);position:relative}
  /* власний компактний вхід: віджет Telegram має фіксовану ширину і свій текст,
     тому в шапці стоїть наша кнопка, а справжній віджет відкривається поповером */
  .auth .tgbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    background:#152b4a;border:1px solid #2a3a66;border-radius:999px;padding:5px 11px 5px 7px;
    font-size:12px;font-weight:700;color:var(--txt);white-space:nowrap;line-height:1}
  .auth .tgbtn:hover{border-color:#2AABEE}
  .auth .tgbtn svg{width:17px;height:17px;flex:0 0 auto;display:block}
  .tgpop{position:absolute;top:calc(100% + 8px);right:0;z-index:60;background:var(--card);
    border:1px solid #2a3a66;border-radius:12px;padding:10px;box-shadow:0 12px 34px rgba(0,0,0,.55);
    min-width:150px;min-height:36px;display:flex;align-items:center;justify-content:center}
  .tgpop:empty::after{content:"…";color:var(--dim);font-size:14px}
  .auth img{width:22px;height:22px;border-radius:50%;object-fit:cover}
  .auth .ini{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:#2a3a66;color:var(--txt);font-size:11px;font-weight:800}
  .auth b{color:var(--txt);font-weight:700}
  .auth button{all:unset;cursor:pointer;color:var(--dim);text-decoration:underline;font-size:11px}
  .auth button:hover{color:var(--txt)}
  /* три цифри стовпчиком: ширина колонки стала, тож нічого не зсувається */
  .cnt{display:inline-flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
  .cnt .c{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:900;line-height:1}
  .cnt .c::before{content:"";width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .cnt .c.i{color:var(--green)}   .cnt .c.i::before{background:var(--green)}
  .cnt .c.m{color:var(--gold)}    .cnt .c.m::before{background:var(--gold)}
  .cnt .c.o{color:#5a648a}        .cnt .c.o::before{background:#3a4467}
  .cnt .c.z{opacity:.35}
  .rsvp{border-top:1px solid #243057;padding-top:14px;margin-top:12px}
  .rsvp-h{font-size:12px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:9px}
  .rsvp-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .rsvp-btns button{all:unset;cursor:pointer;padding:9px 16px;border-radius:11px;font-size:13px;font-weight:700;
    background:#0e1530;border:1px solid #2a3a66;color:var(--txt)}
  .rsvp-btns button:hover{border-color:var(--gold)}
  .rsvp-btns button.on{background:var(--green);border-color:var(--green);color:#08210f}
  .rsvp-btns button.on.no{background:#3a3f55;border-color:#3a3f55;color:var(--dim)}
  .rsvp-btns button.on.mb{background:var(--gold);border-color:var(--gold);color:#2a2000}
  .who{margin-top:12px;display:flex;flex-direction:column;gap:7px}
  .who-g{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px}
  .who-l{display:flex;flex-wrap:wrap;gap:7px}
  .who-p{display:flex;align-items:center;gap:6px;background:#0e1530;border:1px solid #2a3a66;
    border-radius:999px;padding:3px 10px 3px 3px;font-size:12px}
  .who-p img{width:20px;height:20px;border-radius:50%;object-fit:cover}
  .who-p .ini{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:#2a3a66;color:var(--txt);font-size:10px;font-weight:800;flex:0 0 auto}
  .who-p.mb{border-color:rgba(244,198,74,.5)}
  .who-p.no{opacity:.5}
  .who-none{color:#5a648a;font-size:12px}
  .login-hint{text-align:center;color:#5a648a;font-size:12px;margin-top:8px}
  .m-heat.h4 b{color:#ff7847} .m-heat.h3 b{color:var(--gold)} .m-heat.h2 b{color:#7f8db5} .m-heat.h1 b{color:#4d5675}

  /* ===== ПЛЕЙ-ОФ (пари у два матчі) ===== */
  .round-tabs{position:sticky;top:var(--hh,52px);z-index:20;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
    padding:8px 4px;margin:0 -4px;background:linear-gradient(180deg,var(--bg) 65%,transparent)}
  .round-tabs::-webkit-scrollbar{display:none}
  .round-tabs button{all:unset;cursor:pointer;flex:0 0 auto;padding:6px 16px;border-radius:999px;font-size:13px;
    font-weight:700;color:var(--dim);background:#0e1530;border:1px solid #20294a;white-space:nowrap}
  .round-tabs button.on{color:#0b1020;background:var(--gold);border-color:var(--gold)}
  .bracket{position:relative;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
  .rounds{display:flex;align-items:center;gap:36px;padding:10px 8px;min-width:max-content}
  .round-col{display:flex;flex-direction:column;justify-content:space-around;flex:0 0 auto;gap:14px}
  .round-col>.rc-h{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);text-align:center;font-weight:800}
  .tie{position:relative;width:252px;background:linear-gradient(180deg,var(--card),var(--card2));
    border:1px solid #28335c;border-radius:13px;overflow:hidden;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28)}
  .tie:hover{border-color:#41507f}
  .tie.live{border-color:var(--red)}
  .tie .rowt{display:flex;align-items:center;gap:9px;padding:0 0 0 12px;height:var(--rh);font-size:14px}
  .tie .rowt+.rowt{border-top:1px solid #232f56}
  .tie .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim);font-weight:600}
  .tie .lgs{width:46px;flex:0 0 auto;align-self:stretch;border-left:1px solid #2a3658;
    display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#6b76a0;font-variant-numeric:tabular-nums}
  .tie .lgs span{width:12px;text-align:center}
  .tie .agg{width:34px;flex:0 0 auto;align-self:stretch;line-height:var(--rh);text-align:center;font-size:15px;
    border-left:1px solid #2a3658;color:#8893b5;font-weight:800;font-variant-numeric:tabular-nums}
  .tie .rowt.win .nm{color:var(--txt)}
  .tie .rowt.win .agg{color:var(--gold)}
  .tie .rowt.win{background:linear-gradient(90deg,rgba(244,198,74,.10),transparent)}
  .tie .rowt.lose .nm,.tie .rowt.lose .agg{opacity:.45}
  .tie .meta{padding:5px 12px;font-size:11px;color:#6b76a0;background:#0f1733;display:flex;justify-content:space-between;gap:8px}
  .agg .pen{font-size:10px;color:var(--gold);vertical-align:super;margin-left:1px}
  .final-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
  .cup{width:74px;line-height:0;filter:drop-shadow(0 8px 22px rgba(244,198,74,.45));animation:float 4s ease-in-out infinite}
  .cup svg{width:100%;height:auto;display:block}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .champ{text-align:center;font-weight:800;color:var(--gold);font-size:15px}

  .err{max-width:680px;margin:40px auto;background:#2a1730;border:1px solid #5a2842;border-radius:12px;padding:18px;color:#ffb3c7}
  .legend{display:flex;flex-wrap:wrap;gap:5px 11px;justify-content:center;align-items:center;color:var(--dim);font-size:11px;margin:14px 0 6px;line-height:1.5}
  .legend b{color:var(--gold)}
  .legend .sep{color:#39426a;user-select:none}
  footer{text-align:center;color:#5a648a;font-size:11px;padding:18px}

  @media (max-width:600px){
    .wrap{padding:10px 6px}
    header{padding:7px 10px;gap:7px}
    header h1{font-size:13px;line-height:1.15}
    header .sub{display:none}
    header .logo{font-size:17px}
    .hrow{gap:8px}
    .hrow1 .status{font-size:10px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    /* на вузькому екрані вхід — лише іконка, імʼя не показуємо: інакше все це
       забирає другий рядок шапки */
    .auth .tgbtn .tgl{display:none}
    .auth .tgbtn{padding:5px 7px}
    .auth b{display:none}
    .tabs{order:3;width:100%;padding:3px}
    .tabs button{flex:1;text-align:center;padding:7px 4px;font-size:11px}
    .legend{font-size:10px;gap:4px 8px;margin:8px 0 4px;padding:0 6px}
    footer{font-size:10px;padding:12px}
    .sched{max-width:100%}
    .day-h{font-size:12px;padding:9px 4px 5px}
    .srow{gap:8px;padding:9px 6px}
    .srow .cntcol{flex:0 0 44px;width:44px}
    .heat{flex:0 0 58px;width:58px}
    .heat b{font-size:14px}
    .heat small{font-size:8px;letter-spacing:0}
    .srow .time{flex:0 0 46px;width:46px;font-size:15px}
    .srow .tm{font-size:13px}
    .tie{width:min(84vw,360px)}
    th,td{padding:6px 5px;font-size:12px}
    /* на вузькому екрані ховаємо другорядні колонки таблиці */
    .c-opt{display:none}
  }

  /* ===== модалка матчу ===== */
  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
    background:rgba(6,10,22,.72);backdrop-filter:blur(4px);padding:18px}
  .modal.show{display:flex}
  .modal-card{position:relative;width:min(420px,100%);max-height:86vh;overflow:auto;
    background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid #2a3a66;border-radius:16px;
    box-shadow:0 22px 60px rgba(0,0,0,.5);padding:22px 18px 18px}
  .modal-x{position:absolute;top:9px;right:11px;all:unset;cursor:pointer;font-size:23px;line-height:1;color:var(--dim);padding:5px}
  .modal-x:hover{color:var(--txt)}
  .m-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:2px 0 14px}
  .m-head .m-team{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;text-align:center;font-size:15px}
  .m-head .m-team img{width:38px;height:38px;object-fit:contain}
  .m-head .m-score{font-size:20px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
  .m-meta{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center;color:var(--dim);font-size:12px;margin-bottom:6px}
  .m-meta .chip{background:#0e1530;border:1px solid #2a3a66;border-radius:999px;padding:2px 10px;color:var(--txt);font-weight:700}
  .m-actions{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:9px}
  .cal-title{font-weight:800;font-size:13px;color:var(--dim)}
  .cal-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .cal-opt{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    background:#0e1530;border:1px solid #2a3a66;border-radius:11px;padding:9px 15px;
    font-size:13px;font-weight:700;color:var(--txt)}
  .cal-opt:hover{border-color:var(--gold);background:#141d3c}
  .cal-hint{color:#5a648a;font-size:11px;text-align:center;max-width:300px}
  .m-legs{border-top:1px solid #243057;padding-top:12px;margin-top:12px;font-size:13px}
  .m-legs .lg{display:flex;justify-content:space-between;gap:10px;padding:4px 0;color:var(--dim)}
  .m-legs .lg b{color:var(--txt);font-variant-numeric:tabular-nums}
  .m-stats{margin-top:14px}
  .stats-h{font-size:12px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;

// ================== наскільки матч вартий перегляду ==================
// Базовий «клас» клубу 1–10: статус у Європі, склад, і наскільки за ним цікаво стежити.
// Значення суб'єктивні за визначенням — це редакційна шкала, її легко правити руками.
const TEAM_RATING={
  "Real Madrid":10,"Bayern Munich":10,"Barcelona":10,"Manchester City":10,"Liverpool":10,"Paris Saint Germain":10,
  "Arsenal":9,"Inter":9,"Atlético Madrid":9,
  "Manchester United":8,"Napoli":8,"Borussia Dortmund":8,"AS Roma":8,
  "Sporting CP":7,"FC Porto":7,"RB Leipzig":7,"Aston Villa":7,"Villarreal":7,
  "Galatasaray":6,"Fenerbahce":6,"Feyenoord":6,"PSV Eindhoven":6,"Lille":6,"VfB Stuttgart":6,"Real Betis":6,
  "Club Brugge KV":5,"Shakhtar Donetsk":5,"Lens":5,"Como":5,"Slavia Praha":5,"Bodø/Glimt":5,
  "AEK Athens FC":4,
  "LASK Linz":3,"Slovan Bratislava":3,"Viking":3,
  "Sabah FA":2,
  // ---- Прем'єр-ліга 2026/27 ----
  "Newcastle United":8,"Chelsea":8,"Tottenham":7,"Brighton":6,"Everton":6,
  "Nottingham Forest":6,"Crystal Palace":5,"Fulham":5,"Brentford":5,"Bournemouth":5,"Leeds":5,
  "Sunderland":4,"Ipswich":4,"Hull City":3,"Coventry":3,
  // ---- Ла Ліга 2026/27 ----
  "Athletic Club":7,"Real Sociedad":6,"Sevilla FC":6,"Valencia":6,
  "Celta de Vigo":5,"Osasuna":5,"Rayo Vallecano":5,
  "Getafe":4,"Espanyol":4,"Alavés":4,"Deportivo La Coruña":4,
  "Levante":3,"Elche":3,"Racing Santander":3,"Malaga":3
};
// матчі, які дивляться не за клас, а за ненависть
const DERBIES=[
  ["Liverpool","Everton"],["Manchester United","Manchester City"],["Arsenal","Tottenham"],
  ["Chelsea","Tottenham"],["Chelsea","Arsenal"],["Newcastle United","Sunderland"],
  ["Crystal Palace","Brighton"],["Chelsea","Fulham"],["Leeds","Manchester United"],
  ["Real Madrid","Barcelona"],["Real Madrid","Atlético Madrid"],["Sevilla FC","Real Betis"],
  ["Athletic Club","Real Sociedad"],["Barcelona","Espanyol"],["Valencia","Levante"],
  ["Celta de Vigo","Deportivo La Coruña"],["Getafe","Rayo Vallecano"]
];
const DERBY_SET=new Set(DERBIES.map(([a,b])=>pairKey(a,b)));
const isDerby=m=>DERBY_SET.has(pairKey(m.home.name,m.away.name));
// у межах одного чемпіонату «європейський клас» стискається, тож шкалу розтягуємо по лізі
const LG_SCALE={ucl:{lo:2,hi:10},apl:{lo:2.5,hi:9.6},laliga:{lo:2.5,hi:10}};
const _rateByTok=(()=>{ const m={}; for(const k in TEAM_RATING) m[tokset(k)]=TEAM_RATING[k]; return m; })();
function teamRating(name){
  if(TEAM_RATING[name]!=null) return TEAM_RATING[name];
  const v=_rateByTok[tokset(name)];
  return v!=null?v:5;                                  // невідомий клуб (новий сезон) — середина шкали
}
// Матч цікавий рівно настільки, наскільки сильніша його СЛАБША сторона, тому в неї більша вага.
// Плюс невелика надбавка за рівність сил, яка сама масштабується від класу команд.
function matchHeat(m){
  const a=teamRating(m.home.name), b=teamRating(m.away.name);
  const lo=Math.min(a,b), hi=Math.max(a,b);
  let v=0.72*lo+0.28*hi;
  if(hi-lo<=1) v+=0.5*lo/10;
  if(isDerby(m)) v+=1.5;                                  // дербі варте більше, ніж сума класів
  const sc=LG_SCALE[LG]||LG_SCALE.ucl;
  v=1+9*Math.max(0,Math.min(1,(v-sc.lo)/(sc.hi-sc.lo)));
  return Math.max(1,Math.min(10,Math.round(v)));
}
function heatClass(h){ return h>=9?"h4":h>=7?"h3":h>=5?"h2":"h1"; }
function heatWord(h){ const T=t(); return h>=9?T.hot4:h>=7?T.hot3:h>=5?T.hot2:T.hot1; }

const DONE_RE=/finish|full|ended|aet|pen|after/i;
const isDone=m=>DONE_RE.test(m.status||"");
function liveNow(m){
  if(!m||isDone(m)||!m.ts) return false;
  const now=Date.now(); return now>=m.ts && now<m.ts+MATCH_MS;
}
const LS_RE=/^League Stage - (\d+)$/i;
const RS_RE=/^Regular Season - (\d+)$/i;                  // чемпіонати: «Regular Season - 12»
const KO_ORDER=["Round of 32","Round of 16","Quarter-finals","Semi-finals","Final"];
function lsNum(m){ const x=LS_RE.exec(m.round||"")||RS_RE.exec(m.round||""); return x? +x[1] : 0; }
const isLS=m=>lsNum(m)>0;
const isKO=m=>KO_ORDER.includes(m.round||"");
function roundLabel(m){
  const n=lsNum(m); if(n) return t().rTour(n);
  return t().rKo[m.round]||m.round||"";
}

async function load(){
  const want=LG;
  try{
    const r=await fetch("/fixtures?league="+want+"&t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    // дедуплікація за id: пагінація джерела інколи повертає той самий матч двічі
    const seen=new Map();
    for(const m of (d.matches||[])){ if(m&&m.id!=null&&m.home&&m.away&&m.home.name&&m.away.name) seen.set(m.id,m); }
    if(want!==LG) return;                                // встигли перемкнути лігу
    MATCHES=[...seen.values()];
    UPDATED=d.updated||Date.now();
    LGCACHE[want]={matches:MATCHES,updated:UPDATED,stand:STAND};
    if(LG_KIND[want]==="league") loadStandings(want);
    render();
    document.getElementById("upd").textContent=
      t().updated(new Date().toLocaleTimeString(locale(),{hour:"2-digit",minute:"2-digit"}));
  }catch(e){
    document.getElementById("upd").textContent=t().updateError;
    if(!MATCHES.length) document.getElementById("table").innerHTML=t().loadErr(e.message);
  }
}
// таблиця з джерела: у Ла Лізі перший тай-брейк — особисті зустрічі, самі так не порахуємо
async function loadStandings(code){
  try{
    const d=await (await fetch("/standings?league="+code,{cache:"no-store"})).json();
    if(d&&d.status==="ok"&&d.groups&&d.groups.length){
      const rows=d.groups[0].rows||[];
      if(LGCACHE[code]) LGCACHE[code].stand=rows;
      if(code===LG){ STAND=rows; buildTable(); }
    }
  }catch(e){}
}
function render(){

  if(DEMO && !RSVP.length && MATCHES.length){ const d=demoData(); ME=d.me; RSVP=d.rows; renderAuth(); }

// ================== таблиця лігової фази ==================
function computeTable(){
  // якщо є таблиця з джерела — беремо її: порядок і тай-брейки там правильні для кожної ліги
  if(STAND&&STAND.length){
    return STAND.map(r=>{
      const tt=r.t||{};
      return {id:(r.team||{}).id,name:(r.team||{}).name,logo:(r.team||{}).logo,
        p:tt.games||0,w:tt.wins||0,d:tt.draws||0,l:tt.loses||0,
        gf:tt.scoredGoals||0,ga:tt.receivedGoals||0,pts:r.pts||0,pos:r.pos};
    }).sort((x,y)=>(x.pos||99)-(y.pos||99));
  }
  const rows=new Map();
  const touch=tm=>{
    if(!rows.has(tm.id)) rows.set(tm.id,{id:tm.id,name:tm.name,logo:tm.logo,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
    return rows.get(tm.id);
  };
  for(const m of MATCHES){
    if(!isLS(m)) continue;
    const H=touch(m.home), A=touch(m.away);
    if(!isDone(m)||!m.score) continue;
    const [a,b]=m.score;
    H.p++; A.p++; H.gf+=a; H.ga+=b; A.gf+=b; A.ga+=a;
    if(a>b){ H.w++; A.l++; H.pts+=3; }
    else if(a<b){ A.w++; H.l++; A.pts+=3; }
    else { H.d++; A.d++; H.pts++; A.pts++; }
  }
  return [...rows.values()].sort((x,y)=>
    (y.pts-x.pts) || ((y.gf-y.ga)-(x.gf-x.ga)) || (y.gf-x.gf) || x.name.localeCompare(y.name));
}
function buildTable(){
  const box=document.getElementById("table"), key=document.getElementById("zone-key"), T=t();
  const rows=computeTable();
  if(!rows.length){ box.innerHTML=`<div class="empty">${isCup()?T.tableEmpty:T.tableEmptyL}</div>`; key.innerHTML=""; return; }
  // поки не зіграно жодного матчу — це просто список учасників, зони не фарбуємо (інакше
  // «перша вісімка» виглядала б як результат, хоча це лише алфавіт)
  const started=rows.some(r=>r.p>0);
  const tr=rows.map((r,i)=>{
    const pos=r.pos||i+1;
    const z=!started?"":isCup()?(pos<=8?"z1":pos<=24?"z2":"z3"):(pos<=4?"z1":pos===5?"z2":pos>=18?"z3":"");
    return `<tr class="${z}">
      <td class="pos">${pos}</td>
      <td class="team"><div class="tw"><img class="crest" src="${r.logo||""}" alt="" loading="lazy"><span class="nm">${r.name}</span></div></td>
      <td>${r.p}</td>
      <td class="c-opt">${r.w}</td><td class="c-opt">${r.d}</td><td class="c-opt">${r.l}</td>
      <td class="c-opt">${r.gf}:${r.ga}</td>
      <td>${r.gf-r.ga>0?"+":""}${r.gf-r.ga}</td>
      <td><span class="pts">${r.pts}</span></td>
    </tr>`;
  }).join("");
  box.innerHTML=`<table>
    <thead><tr>
      <th>${T.thPos}</th><th style="text-align:left">${T.thTeam}</th><th>${T.thP}</th>
      <th class="c-opt">${T.thW}</th><th class="c-opt">${T.thD}</th><th class="c-opt">${T.thL}</th>
      <th class="c-opt">${T.thG}</th><th>${T.thGD}</th><th>${T.thPts}</th>
    </tr></thead><tbody>${tr}</tbody></table>`;
  const zk=isCup()?[T.z1,T.z2,T.z3]:[T.zl1,T.zl2,T.zl3];
  key.innerHTML = started ? [
    `<span><i style="background:rgba(63,208,125,.5)"></i>${zk[0]}</span>`,
    `<span><i style="background:rgba(244,198,74,.5)"></i>${zk[1]}</span>`,
    `<span><i style="background:#2a3450"></i>${zk[2]}</span>`
  ].join("") : `<span>${isCup()?T.notStarted:T.tableEmptyL}</span>`;
}

// ================== розклад ==================
function teamRowHtml(tm, sc, cls){
  return `<div class="tm ${cls}"><img class="crest" src="${tm.logo||""}" alt="" loading="lazy">
    <span class="nm">${tm.name}</span><span class="sc">${sc}</span></div>`;
}
let schedMode="all";                                      // all | hot | round
function setHot(v){ schedMode=v?"hot":"all"; buildSchedule(); }
function setMode(v){ schedMode=v; buildSchedule(); }
// «поточний тур» — той, у якому найближчий незіграний матч (а якщо все зіграно, останній)
function curRound(){
  const now=Date.now();
  const next=MATCHES.filter(m=>m.ts&&!isDone(m)).sort((a,b)=>a.ts-b.ts)[0];
  if(next) return lsNum(next);
  const last=MATCHES.filter(m=>m.ts).sort((a,b)=>b.ts-a.ts)[0];
  return last?lsNum(last):0;
}
function buildSchedule(){
  const box=document.getElementById("sched"), T=t();
  const filt=document.getElementById("sched-filt");
  let list=MATCHES.filter(m=>m.ts).sort((a,b)=>a.ts-b.ts);
  const cr=isCup()?0:curRound();
  if(filt) filt.innerHTML=
    (cr?`<button class="${schedMode==="round"?"on":""}" onclick="setMode('round')">${T.fRound(cr)}</button>`:"")+
    `<button class="${schedMode==="all"?"on":""}" onclick="setMode('all')">${T.fAll}</button>`+
    `<button class="${schedMode==="hot"?"on":""}" onclick="setMode('hot')">${T.fHot}</button>`;
  if(schedMode==="hot") list=list.filter(m=>matchHeat(m)>=7);
  if(schedMode==="round"&&cr) list=list.filter(m=>lsNum(m)===cr);
  if(!list.length){ box.innerHTML=`<div class="empty">${schedMode==="hot"?T.noHot:(isCup()?T.tableEmpty:T.tableEmptyL)}</div>`; return; }
  const today=dayKey(new Date());
  let focusSet=false, html="", curDay="";
  for(const m of list){
    const dt=mDate(m), dk=dayKey(dt);
    if(dk!==curDay){
      curDay=dk;
      const isFocus=!focusSet && dk>=today; if(isFocus) focusSet=true;
      html+=`<div class="day-h${isFocus?" focus":""}"${isFocus?' id="focus-day"':""}>${dayLabel(dt)} <span class="rl">· ${roundLabel(m)}</span></div>`;
    }
    const live=liveNow(m), done=isDone(m), sc=m.score;
    const h=matchHeat(m), hot=h>=9;
    const w1=sc&&sc[0]>sc[1], w2=sc&&sc[1]>sc[0];
    const timeMain=done?"✅":live?T.live:fmtTime(dt);
    const timeSub=done?"":live?T.liveNow:tzLabel(dt);
    html+=`<div class="srow${hot&&!done?" hot":""}${live?" live":""}${(isToday(dt)&&!done&&!live)?" today":""}${done?" done":""}" onclick="openMatch(${m.id})">
      <div class="time">${timeMain}<small>${timeSub}</small></div>
      <div class="cntcol">${(()=>{const r=rsvpFor(m.id);
        const n=r.in.length, mb=r.maybe.length, no=r.out.length;
        if(!n&&!mb&&!no) return "";                       // ніхто не відповів — колонка порожня
        const c=(cls,v,ttl)=>`<span class="c ${cls}${v?"":" z"}" title="${ttl}">${v}</span>`;
        return `<span class="cnt">${c("i",n,T.whoIn)}${c("m",mb,T.whoMaybe)}${c("o",no,T.whoOut)}</span>`;})()}</div>
      <div class="pair">
        ${teamRowHtml(m.home, sc?sc[0]:"–", w1?"w":w2?"l":"")}
        ${teamRowHtml(m.away, sc?sc[1]:"–", w2?"w":w1?"l":"")}
      </div>
      <div class="heat ${heatClass(h)}" title="${heatWord(h)}"><b>${h}</b><small>${heatWord(h)}</small></div>
    </div>`;
  }
  box.innerHTML=html;
}

// ================== плей-оф (пари у два матчі) ==================
// збирає матчі раунду в пари (2 матчі) з сумарним рахунком
function tiesOf(round){
  const ms=MATCHES.filter(m=>m.round===round).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const by=new Map();
  for(const m of ms){
    const k=pairKey(m.home.name,m.away.name);
    if(!by.has(k)) by.set(k,{legs:[],a:m.home,b:m.away});   // a/b — орієнтація за першим матчем
    by.get(k).legs.push(m);
  }
  return [...by.values()].map(tie=>{
    let ga=0,gb=0,pa=null,pb=null,anyScore=false;
    for(const lg of tie.legs){
      if(!lg.score) continue;
      anyScore=true;
      const homeIsA=tokset(lg.home.name)===tokset(tie.a.name);
      ga+=homeIsA?lg.score[0]:lg.score[1];
      gb+=homeIsA?lg.score[1]:lg.score[0];
      if(lg.pens){ const hA=homeIsA; pa=hA?lg.pens[0]:lg.pens[1]; pb=hA?lg.pens[1]:lg.pens[0]; }
    }
    const allDone=tie.legs.length>0 && tie.legs.every(isDone);
    let win=0;
    if(allDone&&anyScore){
      if(pa!=null&&pb!=null&&pa!==pb) win=pa>pb?1:2;
      else if(ga!==gb) win=ga>gb?1:2;
    }
    return {...tie, ga, gb, pa, pb, anyScore, allDone, win, live:tie.legs.some(liveNow)};
  });
}
const CUP_SVG=`<svg viewBox="0 0 64 64"><path fill="#f4c64a" d="M18 6h28v12a14 14 0 0 1-28 0V6z"/>
  <path fill="#e0ae2f" d="M46 8h6a8 8 0 0 1-8 12V8zM18 8h-6a8 8 0 0 0 8 12V8z"/>
  <rect x="28" y="30" width="8" height="12" fill="#e0ae2f"/><rect x="20" y="42" width="24" height="6" rx="2" fill="#f4c64a"/>
  <rect x="16" y="48" width="32" height="6" rx="2" fill="#e0ae2f"/></svg>`;
function tieCard(tie, round){
  const T=t();
  const cls=(n)=>tie.allDone?(tie.win===n?"win":tie.win?"lose":""):"";
  const aggA=tie.anyScore?tie.ga:"–", aggB=tie.anyScore?tie.gb:"–";
  const penA=(tie.pa!=null)?`<span class="pen">${tie.pa}</span>`:"";
  const penB=(tie.pb!=null)?`<span class="pen">${tie.pb}</span>`:"";
  // голи конкретної команди в кожному матчі пари (а не рядок рахунку)
  const goalsOf=(team)=>tie.legs.map(l=>{
    if(!l.score) return "–";
    return tokset(l.home.name)===tokset(team.name) ? l.score[0] : l.score[1];
  });
  const two=tie.legs.length>1;
  const cellsA=two?`<div class="lgs">${goalsOf(tie.a).map(g=>`<span>${g}</span>`).join("")}</div>`:"";
  const cellsB=two?`<div class="lgs">${goalsOf(tie.b).map(g=>`<span>${g}</span>`).join("")}</div>`:"";
  const first=tie.legs[0];
  const dt=first?mDate(first):null;
  const when=dt?dayLabel(dt).replace(/^\w/,c=>c.toUpperCase()):"";
  return `<div class="tie${tie.live?" live":""}" onclick="openMatch(${first?first.id:0})">
    <div class="rowt ${cls(1)}"><img class="crest" src="${tie.a.logo||""}" alt=""><span class="nm">${tie.a.name}</span>
      ${cellsA}<span class="agg">${aggA}${penA}</span></div>
    <div class="rowt ${cls(2)}"><img class="crest" src="${tie.b.logo||""}" alt=""><span class="nm">${tie.b.name}</span>
      ${cellsB}<span class="agg">${aggB}${penB}</span></div>
    <div class="meta"><span>${tie.live?'<span class="badge-live">LIVE</span> ':""}${when}</span>
      <span>${two?T.agg:(dt?fmtTime(dt):"")}</span></div>
  </div>`;
}
function buildBracket(){
  const root=document.getElementById("bracket"), bar=document.getElementById("round-tabs"), T=t();
  const present=KO_ORDER.filter(r=>MATCHES.some(m=>m.round===r));
  if(!present.length){ root.innerHTML=`<div class="empty">${T.koEmpty}</div>`; bar.innerHTML=""; return; }
  bar.innerHTML=present.map(r=>`<button data-round="${r}" onclick="gotoRound('${r}')">${T.rKo[r]||r}</button>`).join("");
  const cols=present.map(r=>{
    const ties=tiesOf(r);
    const inner=ties.map(x=>tieCard(x,r)).join("");
    if(r==="Final"){
      const f=ties[0];
      const champ=f&&f.win?(f.win===1?f.a:f.b):null;
      return `<div class="round-col" data-round="${r}"><div class="rc-h">${T.rKo[r]}</div>
        <div class="final-wrap"><div class="cup">${CUP_SVG}</div>
        <div class="champ">${champ?champ.name:""}</div>${inner}</div></div>`;
    }
    return `<div class="round-col" data-round="${r}"><div class="rc-h">${T.rKo[r]||r}</div>${inner}</div>`;
  }).join("");
  root.innerHTML=`<div class="rounds">${cols}</div>`;
  const firstBtn=bar.querySelector("button"); if(firstBtn) firstBtn.classList.add("on");
}
function gotoRound(r){
  const br=document.getElementById("bracket"), col=br.querySelector(`.round-col[data-round="${r}"]`);
  if(col) br.scrollTo({left:col.offsetLeft-10, behavior:"smooth"});
  document.querySelectorAll("#round-tabs button").forEach(b=>b.classList.toggle("on", b.dataset.round===r));
}

let statsReq=0;
function closeModal(){ document.getElementById("modal").classList.remove("show"); }
function openMatch(id){
  const m=MATCHES.find(x=>String(x.id)===String(id)); if(!m) return;
  const T=t(), dt=mDate(m), sc=m.score, live=liveNow(m);
  const head=sc?`${sc[0]} : ${sc[1]}`:(dt?fmtTime(dt):"");
  const pens=m.pens?`<div class="m-meta"><span>${T.pens(m.pens[0],m.pens[1])}</span></div>`:"";

let PANE="st", PANEM=null, paneReq=0;
function initPanes(m){ PANEM=m; PANE="st"; openPane("st"); }
function renderPaneTabs(){
  const T=t(), box=document.getElementById("m-tabs"); if(!box) return;
  box.innerHTML=[["st",T.mtStats],["ln",T.mtLine],["ev",T.mtEv]]
    .map(([k,lbl])=>`<button class="${PANE===k?"on":""}" onclick="openPane('${k}')">${lbl}</button>`).join("");
}
function openPane(k){
  PANE=k; renderPaneTabs();
  const box=document.getElementById("m-pane"), m=PANEM; if(!box||!m) return;
  const T=t(), my=++paneReq;
  const started=m.ts&&Date.now()>=m.ts;
  if(!started&&(k==="st"||k==="ev")){ box.innerHTML=`<div class="stats-none">${k==="st"?T.statSoon:T.evSoon}</div>`; return; }
  box.innerHTML=`<div class="stats-load">${T.statLoading}</div>`;
  const url=k==="st"?"/stats":k==="ln"?"/lineup":"/events";
  fetch(url+"?id="+encodeURIComponent(m.id)+"&lg="+LG,{cache:"no-store"})
    .then(r=>r.json())
    .then(d=>{
      if(my!==paneReq) return;
      if(k==="st") renderStats(box,d,m);
      else if(k==="ln") renderLineup(box,d,m);
      else renderEvents(box,d,m);
    })
    .catch(()=>{ if(my===paneReq) box.innerHTML=`<div class="stats-none">${T.statNA}</div>`; });
}

// ---- статистика: усе, що віддає джерело, згруповане ----
function renderStats(box,data,m){
  const T=t(), L0=stl();
  if(!data||data.status!=="ok"){
    box.innerHTML=`<div class="stats-none">${data&&data.status==="pending"?T.statSoon:T.statNA}</div>`; return;
  }
  let L=data.home,R=data.away;
  if(tokset(data.home.name)!==tokset(m.home.name)&&tokset(data.away.name)===tokset(m.home.name)){ L=data.away; R=data.home; }
  const ls=L.s||{}, rs=R.s||{};
  const fmt=(v,k)=>{
    if(v==null) return "–";
    if(ST_DEC.has(k)) return (+v).toFixed(2);
    if(ST_PCT.has(k)) return Math.round(+v*100)+"%";
    if(k==="passpct") return v+"%";
    return typeof v==="number"?Math.round(v):v;
  };
  let html="";
  if(ls.poss!=null||rs.poss!=null){
    const lp=Math.round((+ls.poss||0)*100), rp=Math.round((+rs.poss||0)*100);
    html+=`<div class="st-poss"><span>${lp}%</span><div class="st-bar"><i style="width:${lp}%"></i></div><span>${rp}%</span></div>
           <div class="st-poss-lbl">${L0.poss}</div>`;
  }
  const cardTxt=sd=>{ const y=+sd.yellow||0,r=+sd.red||0; let o=""; if(y)o+=`🟨${y} `; if(r)o+=`🟥${r}`; return o.trim()||"–"; };
  for(const [g,keys] of ST_GROUPS){
    let rows="";
    for(const k of keys){
      if(k==="poss") continue;
      if(k==="cards"){
        if(ls.yellow||ls.red||rs.yellow||rs.red)
          rows+=`<div class="st-row"><span class="st-l">${cardTxt(ls)}</span><span class="st-m">${L0.cards}</span><span class="st-r">${cardTxt(rs)}</span></div>`;
        continue;
      }
      if(ls[k]==null&&rs[k]==null) continue;
      rows+=`<div class="st-row${k==="passpct"?" acc":""}"><span class="st-l">${fmt(ls[k],k)}</span>`+
            `<span class="st-m">${L0[k]||k}</span><span class="st-r">${fmt(rs[k],k)}</span></div>`;
    }
    if(rows) html+=`<div class="st-grp">${T.stGrp[g]}</div>`+rows;
  }
  if(!html){ box.innerHTML=`<div class="stats-none">${T.statNA}</div>`; return; }
  box.innerHTML=(data.final?"":`<div style="margin-bottom:6px"><span class="stats-live">${T.statLiveTag}</span></div>`)+html;
}

// ---- склади: намальоване поле за схемою ----
const shortName=n=>{ const s=String(n||""); return s.length>18?s.slice(0,17)+"…":s; };
function sideHtml(sd,cls,rev){
  if(!sd||!sd.rows||!sd.rows.length) return "";
  const rows=rev?[...sd.rows].reverse():sd.rows;
  return `<div class="phalf">`+rows.map(row=>`<div class="pline">`+(row||[]).map(pl=>
    `<div class="pl ${cls}"><span class="sh">${pl.num==null?"":pl.num}</span><span class="pn">${shortName(pl.name)}</span></div>`
  ).join("")+`</div>`).join("")+`</div>`;
}
function teamLine(sd){
  if(!sd) return "";
  return `<div class="pteam"><img src="${sd.logo||""}" alt="">${sd.name||""}`+
         (sd.formation?`<span class="frm">· ${sd.formation}</span>`:"")+`</div>`;
}
function subsHtml(T,a,b){
  const one=sd=>!sd||!sd.subs||!sd.subs.length?"":
    `<div><b>${sd.name} — ${T.subsLbl}</b>`+sd.subs.map(pl=>`<span>${pl.num==null?"":pl.num+" "}${shortName(pl.name)}</span>`).join(", ")+`</div>`;
  const x=one(a)+one(b);
  return x?`<div class="subs">${x}</div>`:"";
}
function renderLineup(box,d,m){
  const T=t();
  if(!d||d.status!=="ok"){
    box.innerHTML=`<div class="stats-none">${d&&d.status==="pending"?T.lineNA:T.lineSoon}</div>`; return;
  }
  let H=d.home,A=d.away;
  if(H&&A&&tokset(H.name)!==tokset(m.home.name)&&tokset(A.name)===tokset(m.home.name)){ const x=H; H=A; A=x; }
  box.innerHTML=teamLine(H)+
    `<div class="pitch">${sideHtml(H,"home",false)}${sideHtml(A,"away",true)}</div>`+
    teamLine(A)+subsHtml(T,H,A);
}

const EV_IC={"Goal":"⚽","Own Goal":"🥴","Penalty":"⚽","Missed Penalty":"❌","Yellow Card":"🟨",
  "Red Card":"🟥","Substitution":"🔁","VAR Goal Confirmed":"📺","VAR Goal Cancelled":"📺",
  "VAR Penalty":"📺","VAR Penalty Cancelled":"📺","VAR Goal Cancelled - Offside":"📺"};
function renderEvents(box,d,m){
  const T=t();
  if(!d||d.status!=="ok"||!d.list||!d.list.length){
    box.innerHTML=`<div class="stats-none">${d&&d.status==="notstarted"?T.evSoon:T.evNone}</div>`; return;
  }
  const html=d.list.map(e=>{
    const home=tokset(e.team||"")===tokset(m.home.name);
    const ic=EV_IC[e.type]||"•";
    const sub=[e.assist?"↳ "+e.assist:"", e.out?"⟵ "+e.out:"", e.type==="Substitution"?"":""].filter(Boolean).join(" · ");
    const who=`<div class="who">${e.player||""}${sub?`<small>${sub}</small>`:""}</div>`;
    const mi=`<div class="mi">${e.time||""}'</div>`;
    return home
      ? `<div class="ev">${mi}<div class="ic">${ic}</div>${who}</div>`
      : `<div class="ev away">${who}<div class="ic">${ic}</div>${mi}</div>`;
  }).join("");
  box.innerHTML=`<div class="evs">${html}</div>`;
}

// ================== календар ==================
function pad2(n){ return String(n).padStart(2,"0"); }
function icsStamp(d){ return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate())
  +"T"+pad2(d.getUTCHours())+pad2(d.getUTCMinutes())+pad2(d.getUTCSeconds())+"Z"; }
function icsEsc(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;"); }
function calEvent(m){
  const dt=mDate(m); if(!dt) return null;
  const rl=roundLabel(m), sc=m.score;
  return {
    start:dt, end:new Date(dt.getTime()+120*60000),
    title:t().evTitle(m.home.name,m.away.name,rl),
    desc:[ t().descMatch(m.home.name,m.away.name), rl?t().descRound(rl):"",
      t().descWatch(dayLabel(dt),fmtTime(dt),tzLabel(dt)),
      sc?t().descResult(sc[0],sc[1]):"", t().descSite ].filter(Boolean).join("\n"),
    loc:""
  };
}
function googleCalUrl(m){
  const e=calEvent(m); if(!e) return "#";
  const p=new URLSearchParams({action:"TEMPLATE",text:e.title,
    dates:icsStamp(e.start)+"/"+icsStamp(e.end),details:e.desc,location:e.loc});
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
function outlookCalUrl(m){
  const e=calEvent(m); if(!e) return "#";
  const p=new URLSearchParams({path:"/calendar/action/compose",rru:"addevent",
    subject:e.title,startdt:e.start.toISOString(),enddt:e.end.toISOString(),body:e.desc,location:e.loc});
  return "https://outlook.live.com/calendar/0/deeplink/compose?"+p.toString();
}
function appleWebcalUrl(m){
  const e=calEvent(m); if(!e) return "#";
  const p=new URLSearchParams({title:e.title,start:icsStamp(e.start),end:icsStamp(e.end),
    desc:e.desc,loc:e.loc,uid:"m"+m.id});
  return "webcal://"+location.host+"/event.ics?"+p.toString();
}
function addToCalendar(id){
  const m=MATCHES.find(x=>String(x.id)===String(id)); if(!m) return;
  const e=calEvent(m); if(!e) return;
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//WAWA//UCL2627//UK","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "BEGIN:VEVENT","UID:ucl2627-"+m.id+"@ucl2627","DTSTAMP:"+icsStamp(new Date()),
    "DTSTART:"+icsStamp(e.start),"DTEND:"+icsStamp(e.end),
    "SUMMARY:"+icsEsc(e.title),"DESCRIPTION:"+icsEsc(e.desc),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(e.title),"TRIGGER:-PT30M","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download="ucl2627-"+m.id+".ics";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1500);
}

// ================== авторизація Telegram + бронювання ==================
let ME=null, RSVP=[];

// ?demo=1 — показати, як усе виглядає із заповненими даними. Нічого не пише в базу.
const DEMO = new URLSearchParams(location.search).get("demo")==="1";
function demoData(){
  const names=["Дмитро","Олексій","Марко","Ігор","Тарас","Юрій","Богдан","Влад"];
  const plan=[[5,2,1],[2,1,0],[0,0,0],[7,1,0],[1,3,2],[0,0,0],[0,2,0],[3,0,1]];
  const ms=MATCHES.filter(m=>m.ts).sort((a,b)=>a.ts-b.ts);
  const rows=[];
  plan.forEach((spec,i)=>{
    const m=ms[i]; if(!m) return;
    let k=0;
    ["in","maybe","out"].forEach((st,si)=>{
      for(let j=0;j<spec[si];j++,k++){
        const n=names[k%names.length];
        rows.push({match_id:String(m.id),user_id:"demo:"+k+":"+i,status:st,name:n,photo:null,username:null});
      }
    });
  });
  return {me:{id:"demo:0:0",name:"Дмитро",photo:null,username:"demo"},rows};
}
async function loadRsvp(){
  if(DEMO){ const d=demoData(); ME=d.me; RSVP=d.rows; renderAuth(); buildSchedule(); return; }
  try{
    const d=await (await fetch("/rsvp",{cache:"no-store"})).json();
    ME=d.me||null; RSVP=d.rows||[];
  }catch(e){ ME=null; RSVP=[]; }
  renderAuth(); buildSchedule();
}
function rsvpFor(id){
  const rows=RSVP.filter(x=>String(x.match_id)===String(id));
  return {
    in:rows.filter(r=>r.status==="in"),
    maybe:rows.filter(r=>r.status==="maybe"),
    out:rows.filter(r=>r.status==="out"),
    mine:ME?((rows.find(r=>r.user_id===ME.id)||{}).status||null):null
  };
}
function renderAuth(){
  const box=document.getElementById("auth"); if(!box) return;
  const T=t();
  if(ME){
    box.innerHTML=`${ME.photo?`<img src="${ME.photo}" alt="">`:`<span class="ini">${(ME.name||"?").trim().charAt(0).toUpperCase()}</span>`}<b>${ME.name}</b><button onclick="logout()">${T.logout}</button>`;
    return;
  }
  box.innerHTML="";
  if(DEMO){ box.innerHTML='<b style="color:var(--gold)">DEMO</b>'; return; }
  if(!TG_OK) return;
  box.innerHTML=`<button class="tgbtn" onclick="toggleTgPop(event)" title="${T.loginTitle}" aria-label="${T.loginTitle}">${TG_SVG}<span class="tgl">${T.login}</span></button>`;
}
const TG_SVG=`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#2AABEE"></circle><path fill="#fff" d="M5.6 11.9l10.4-4c.5-.2.9.1.7.8l-1.8 8.3c-.1.6-.5.7-1 .4l-2.6-1.9-1.3 1.2c-.1.1-.3.2-.5.2l.2-2.7 5-4.5c.2-.2 0-.3-.3-.1l-6.2 3.9-2.1-.7c-.5-.2-.5-.6-.1-.8z"></path></svg>`;
// справжній віджет вантажимо лише коли його попросили — так у шапці стоїть наша кнопка
function toggleTgPop(ev){
  if(ev) ev.stopPropagation();
  const box=document.getElementById("auth"); if(!box) return;
  if(box.querySelector(".tgpop")) return closeTgPop();
  const pop=document.createElement("div");
  pop.className="tgpop";
  box.appendChild(pop);
  tgMounted=false;
  mountTgLogin(pop);
  setTimeout(()=>document.addEventListener("click",tgOutside),0);
}
function closeTgPop(){
  const p=document.querySelector(".tgpop"); if(p) p.remove();
  document.removeEventListener("click",tgOutside);
}
function tgOutside(e){
  if(!e.target.closest||!e.target.closest("#auth")) closeTgPop();
}
// віджет Telegram прив'язаний до домену бота: на localhost він малює лише
// «Bot domain invalid», тому там його просто не вставляємо
const TG_OK=(!/^(localhost|127\.|0\.0\.0\.0|\[?::1)/.test(location.hostname)
  && !location.hostname.endsWith(".local"))
  || location.search.includes("tg=1");   // ?tg=1 — подивитись кнопку на локальному прев'ю
// віджет Telegram вимагає справжній <script>, тому вставляємо елементом, а не innerHTML
let tgMounted=false;
async function mountTgLogin(box){
  if(!TG_OK) return;
  if(tgMounted) return; tgMounted=true;
  let username=null;
  try{ username=(await (await fetch("/tg/info")).json()).username; }catch(e){}
  if(!username){ tgMounted=false; return; }
  const sc=document.createElement("script");
  sc.async=true;
  sc.src="https://telegram.org/js/telegram-widget.js?22";
  sc.setAttribute("data-telegram-login",username);
  sc.setAttribute("data-size","small");
  sc.setAttribute("data-radius","10");
  sc.setAttribute("data-onauth","onTgAuth(user)");
  box.appendChild(sc);
}
window.onTgAuth=async function(user){
  try{
    const r=await fetch("/tg/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(user)});
    if(r.ok){ tgMounted=false; closeTgPop(); await loadRsvp(); }
  }catch(e){}
};
async function logout(){
  try{ await fetch("/logout",{method:"POST"}); }catch(e){}
  ME=null; tgMounted=false; await loadRsvp();
}
async function setRsvp(id,status){
  if(!ME) return;
  if(DEMO){                                    // демо: міняємо лише локальний стан
    RSVP=RSVP.filter(r=>!(String(r.match_id)===String(id) && r.user_id===ME.id));
    RSVP.push({match_id:String(id),user_id:ME.id,status,name:ME.name,photo:null,username:null});
    buildSchedule(); openMatch(id); return;
  }
  const cur=rsvpFor(id).mine;
  const next=(cur===status)?null:status;         // повторний клік знімає вибір
  if(next===null){
    // немає окремого DELETE — просто ставимо «не йду»
    if(status==="out") return;
  }
  try{
    const r=await fetch("/rsvp",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({match:String(id),status:next||status})});
    if(!r.ok) return;
  }catch(e){ return; }
  await loadRsvp();
  openMatch(id);                                  // перемалювати попап з новим станом
}
function rsvpBlock(m){
  const T=t(), r=rsvpFor(m.id);
  const btn=(st,cls,lbl)=>`<button class="${r.mine===st?"on "+cls:""}" onclick="setRsvp(${m.id},'${st}')">${lbl}</button>`;
  const ava=p=>p.photo?`<img src="${p.photo}" alt="">`:`<span class="ini">${(p.name||"?").trim().charAt(0).toUpperCase()}</span>`;
  const chip=(p,cls)=>`<span class="who-p ${cls}">${ava(p)}${p.name}</span>`;
  const group=(list,label,cls)=> list.length
    ? `<div><div class="who-g">${label} · ${list.length}</div><div class="who-l">${list.map(p=>chip(p,cls)).join("")}</div></div>` : "";
  const any=r.in.length||r.maybe.length||r.out.length;
  return `<div class="rsvp">
    <div class="rsvp-h">${T.rsvpTitle}</div>
    ${ME?`<div class="rsvp-btns">${btn("in","","✅ "+T.rIn)}${btn("maybe","mb","🤔 "+T.rMaybe)}${btn("out","no","✖️ "+T.rOut)}</div>`
        :`<div class="login-hint">${T.needLogin}</div>`}
    <div class="who">${any?[group(r.in,T.whoIn,""),group(r.maybe,T.whoMaybe,"mb"),group(r.out,T.whoOut,"no")].filter(Boolean).join("")
                       :`<div class="who-none">${T.whoNone}</div>`}</div>
  </div>`;
}

function buildLangSwitch(){

function setLang(l){

  applyStatic(); render();
}
function setHeaderH(){
  const h=document.querySelector("header");
  if(h) document.documentElement.style.setProperty("--hh",h.offsetHeight+"px");
}
window.addEventListener("resize",()=>{ clearTimeout(window._rt); window._rt=setTimeout(setHeaderH,150); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeModal(); closeTgPop(); } });

applyStatic();
load();
loadRsvp();
setInterval(load,60000);
</script>
</body>
</html>
